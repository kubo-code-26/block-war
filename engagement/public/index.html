<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite • Block War</title>
<style>[hidden]{display:none!important}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#153740,#0b101b 65%);color:#e8f3f6;font:18px system-ui}main{max-width:420px;margin:24px;padding:32px;border:1px solid #277381;border-radius:24px;background:#111927;text-align:center}h1{letter-spacing:.12em;color:#00e5ff}strong{font-size:36px;letter-spacing:.2em}a{display:block;text-decoration:none;border-radius:12px;padding:16px;margin:16px 0;background:#00e5ff;color:#05252b;font-weight:bold}.secondary{background:#253348;color:white}p{line-height:1.5;color:#b7cbd2}</style>
<main><h1>BLOCK WAR</h1><h2>Seu amigo chamou para a arena</h2><p id="message">Entre na sala pelo aplicativo para disputar a partida.</p><strong id="room"></strong><a id="open" hidden>Abrir no Block War</a><a class="secondary" href="https://play.google.com/store/apps/details?id=com.blockwar.game">Ver na Google Play</a><p>Se acabou de instalar, volte a este convite. Você também pode digitar o código em Jogar online → Entrar em sala.</p><a class="secondary" href="https://block-war-ca797.web.app/privacidade/">Privacidade</a></main>
<script>const room=(new URLSearchParams(location.search).get('sala')||'').toUpperCase();if(/^[A-Z0-9]{4}$/.test(room)){document.getElementById('room').textContent=room;const open=document.getElementById('open');open.href='blockwar://join?sala='+encodeURIComponent(room);open.hidden=false}else{document.getElementById('message').textContent='Este convite não contém um código de sala válido. Peça um novo link ao seu amigo.'}</script></html>
